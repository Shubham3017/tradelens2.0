version: '3.8'

services:

  mysql:
    image: mysql:8.0
    container_name: tradelens2-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: tradelens2
    ports:
      - "3308:3306"
    volumes:
      - tradelens2_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: tradelens2-backend
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/tradelens2
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      JWT_SECRET: tradelens-secret-key-2024-very-long-string-for-security
      SERVER_PORT: 8081
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: tradelens2-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  tradelens2_mysql_data: